[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-generation-engine"
version = "1.0.5"
description = "릴프로필 (프로필 / 모델생성) 정본 v1.0.0: Zero-Hardcoding 1-Pass Full-Person 3D Synthesis, Mandatory 1-Hop 8-Dir Bank, Context-Adaptive 5-Lens x 5-Lighting Matrix, De-Airbrushed Raw Pore Restoration, and 4K Optical Mastering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "onnxruntime>=1.16.0",
    "Pillow>=10.0.0",
]

[project.scripts]
reelprofile = "model_generation_engine.cli:main"
model-gen = "model_generation_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["model_generation_engine*"]
