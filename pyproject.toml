[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-generation-engine"
version = "2.0.0"
description = "Universal Zero-Hardcoding Model Generation Engine (모델생성): Single-Pass From-Scratch Synthesis for Any Model, Outfit, Location, and Angle with 4x Real-ESRGAN, Adaptive Halo-Free Matte Skin Micro-Texture, and 5K 21:9 Compositing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "onnxruntime>=1.16.0",
    "Pillow>=10.0.0",
]

[project.scripts]
model-gen = "model_generation_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["model_generation_engine*"]
